name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi app/src/main/java/com/mazoghi/money
          cp index.html app/src/main/assets/index.html
          cp ic_launcher.png app/src/main/res/drawable-nodpi/ic_launcher.png
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Mazoghi"
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.2.2" apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
              namespace "com.mazoghi.money"
              compileSdk 34
              defaultConfig {
                  applicationId "com.mazoghi.money"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="المزوغي"
                  android:icon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/mazoghi/money/MainActivity.java <<'EOF'
          package com.mazoghi.money;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#0f172a"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0f172a"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0f172a"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  if (b != null) web.restoreState(b); else web.loadUrl("file:///android_asset/index.html");
              }
              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }
              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mazoghi-APK
          path: app/build/outputs/apk/debug/*.apk
