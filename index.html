<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة المال الفاخرة</title>
    <!-- FontAwesome للايقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خط Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Chart.js للرسم البياني -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --input-bg: #1e293b;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --accent-gold: #d97706;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --input-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* شاشة القفل */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .lock-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }

        .lock-card i {
            font-size: 3rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        /* الحاوية الرئيسية */
        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 20px;
            position: relative;
            min-height: 680px;
            display: flex;
            flex-direction: column;
        }

        /* الهيدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--accent-gold), #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            margin-right: 6px;
            padding: 8px;
            border-radius: 50%;
        }

        /* التبويبات */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 5px;
            border-radius: 18px;
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 10px 6px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            font-weight: 600;
        }

        .tab-btn i { font-size: 1rem; }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #fff;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        /* شاشات المحتوى */
        .tab-content {
            display: none;
            flex-grow: 1;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* بطاقة الرصيد */
        .balance-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        .balance-title {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: var(--input-bg);
            padding: 10px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-box i { font-size: 1rem; margin-bottom: 4px; }
        .stat-box.income i { color: var(--accent-green); }
        .stat-box.expense i { color: var(--accent-red); }

        /* حاوية الرسم البياني */
        .chart-container {
            background: var(--input-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border-color);
            max-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* النماذج والمدخلات */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            margin-top: 8px;
        }

        .btn-green { background: linear-gradient(135deg, var(--accent-green), #059669); }
        .btn-red { background: linear-gradient(135deg, var(--accent-red), #dc2626); }
        .btn-gold { background: linear-gradient(135deg, var(--accent-gold), #d97706); }

        /* أدوات السجل والتصفية */
        .filter-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .filter-container select {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.8rem;
        }

        .filtered-sum {
            background: var(--input-bg);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            border: 1px dashed var(--border-color);
        }

        .history-list {
            max-height: 280px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--input-bg);
            border-radius: 12px;
            margin-bottom: 8px;
            border-right: 4px solid;
        }

        .history-item.income { border-color: var(--accent-green); }
        .history-item.expense { border-color: var(--accent-red); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            opacity: 0.6;
            margin-right: 10px;
        }
        .delete-btn:hover { opacity: 1; }

        /* نافذة الإعدادات Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            border: 1px solid var(--border-color);
        }

        .pin-input {
            letter-spacing: 10px;
            text-align: center;
            font-size: 1.4rem;
        }

        [data-theme="light"] { --panel-overlay: rgba(255,255,255,0.74); }

            background-image: linear-gradient(var(--panel-overlay), var(--panel-overlay)), var(--bg-image);
            background-size: auto, 92% auto;
            background-position: center, center;
            background-repeat: no-repeat, no-repeat;
            background-color: var(--card-bg);
        }
        .app-container { backdrop-filter: none; }

<body data-theme="dark">

    <!-- شاشة القفل -->
    <div id="lock-screen">
        <div class="lock-card">
            <i class="fas fa-user-lock"></i>
            <h3 style="margin-bottom: 15px;">ادخل الرمز السري</h3>
            <input type="password" id="pin-entry" class="form-control pin-input" maxlength="4" placeholder="••••">
            <button class="btn-submit btn-gold" onclick="unlockApp()" style="margin-top: 15px;">دخول</button>
            <p id="lock-error" style="color: var(--accent-red); margin-top: 10px; font-size: 0.8rem; display: none;">الرمز غير صحيح!</p>
        </div>
    </div>

    <!-- المنظومة الرئيسية -->
    <div class="app-container">
        <!-- الهيدر -->
        <div class="header">
            <h2><i class="fas fa-wallet" style="margin-left: 8px;"></i>محفظتي الفاخرة</h2>
            <div class="header-actions">
                <button onclick="toggleTheme()" title="تغيير المظهر"><i class="fas fa-moon" id="theme-icon"></i></button>
                <button onclick="openSettings()" title="الإعدادات"><i class="fas fa-cog"></i></button>
                <button onclick="lockApp()" title="قفل المنظومة"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <!-- أزرار التبويب الأربعة -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-balance" onclick="switchTab('balance-tab', this)">
                <i class="fas fa-chart-line"></i>
                <span>الرصيد</span>
            </button>
            <button class="tab-btn" onclick="switchTab('income-tab', this)">
                <i class="fas fa-arrow-down"></i>
                <span>دخل</span>
            </button>
            <button class="tab-btn" onclick="switchTab('expense-tab', this)">
                <i class="fas fa-arrow-up"></i>
                <span>مصروف</span>
            </button>
            <button class="tab-btn" onclick="switchTab('history-tab', this)">
                <i class="fas fa-receipt"></i>
                <span>السجل</span>
            </button>
        </div>

        <!-- الواجهة 1: الرصيد مباشر عند الدخول -->
        <div id="balance-tab" class="tab-content active">
            <div class="balance-card">
                <div class="balance-title">الرصيد الحالي (تلقائي)</div>
                <div class="balance-amount" id="total-balance">0.00 د.ل</div>
            </div>

            <div class="stats-grid">
                <div class="stat-box income">
                    <i class="fas fa-wallet"></i>
                    <div style="font-size: 0.75rem; color: var(--text-secondary);">إجمالي الدخل</div>
                    <div id="total-income" style="font-weight: bold; margin-top: 4px;">0.00</div>
                </div>
                <div class="stat-box expense">
                    <i class="fas fa-shopping-cart"></i>
                    <div style="font-size: 0.75rem; color: var(--text-secondary);">إجمالي المصروفات</div>
                    <div id="total-expense" style="font-weight: bold; margin-top: 4px;">0.00</div>
                </div>
            </div>

            <h4 style="margin-bottom: 8px; font-size: 0.85rem; color: var(--text-secondary);">نسبة الدخل إلى المصروفات</h4>
            <div class="chart-container">
                <canvas id="financeChart"></canvas>
            </div>
        </div>

        <!-- الواجهة 2: إدخال الدخل -->
        <div id="income-tab" class="tab-content">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">تسجيل دخل جديد</h3>
            <div class="form-group">
                <label>نوع الدخل</label>
                <select id="income-type" class="form-control">
                    <option value="مرتب">مرتب شهري</option>
                    <option value="دخل يومي">دخل يومي</option>
                    <option value="عمل حر">عمل حر / إضافي</option>
                    <option value="أخرى">مصدر آخر</option>
                </select>
            </div>
            <div class="form-group">
                <label>المبلغ</label>
                <input type="number" id="income-amount" class="form-control" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>ملاحظة (اختياري)</label>
                <input type="text" id="income-note" class="form-control" placeholder="مثال: مرتب شهر مايو">
            </div>
            <button class="btn-submit btn-green" onclick="addTransaction('income')">حفظ الدخل <i class="fas fa-plus"></i></button>
        </div>

        <!-- الواجهة 3: إدخال المصروفات -->
        <div id="expense-tab" class="tab-content">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">تسجيل مصروف جديد</h3>
            <div class="form-group">
                <label>بند المصروف</label>
                <input type="text" id="expense-title" class="form-control" placeholder="مثال: تسوق، بنزين، فواتير">
            </div>
            <div class="form-group">
                <label>المبلغ</label>
                <input type="number" id="expense-amount" class="form-control" placeholder="0.00">
            </div>
            <button class="btn-submit btn-red" onclick="addTransaction('expense')">خصم المصروف <i class="fas fa-minus"></i></button>
        </div>

        <!-- الواجهة 4: السجل والتصنيف -->
        <div id="history-tab" class="tab-content">
            <h3 style="margin-bottom: 12px; font-size: 1.1rem;">سجل العمليات والتصنيف</h3>
            
            <div class="filter-container">
                <select id="filter-type" class="form-control" onchange="renderHistory()">
                    <option value="all">كل العمليات</option>
                    <option value="income">مدخولات فقط</option>
                    <option value="expense">مصروفات فقط</option>
                </select>

                <select id="filter-date" class="form-control" onchange="renderHistory()">
                    <option value="all">كل الأوقات</option>
                    <option value="today">اليوم</option>
                    <option value="week">هذا الأسبوع</option>
                    <option value="month">هذا الشهر</option>
                    <option value="year">هذه السنة</option>
                </select>
            </div>

            <div class="filtered-sum">
                <span>مجموع العمليات المحددة:</span>
                <strong id="filtered-total" style="color: var(--accent-gold);">0.00 د.ل</strong>
            </div>

            <div class="history-list" id="full-history-list"></div>
        </div>

    </div>

    <!-- نافذة الإعدادات Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;"><i class="fas fa-cog"></i> الإعدادات</h3>
            <div class="form-group">
                <label>تغيير الرمز السري</label>
                <input type="password" id="new-pin" class="form-control pin-input" maxlength="4" placeholder="الرمز الجديد">
            </div>
            <button class="btn-submit btn-gold" onclick="changePin()" style="margin-bottom: 10px;">تحديث الرمز</button>
            <button class="btn-submit btn-red" onclick="clearData()">تصفير جميع البيانات <i class="fas fa-trash"></i></button>
            <button class="btn-submit" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-color); margin-top: 10px;" onclick="closeSettings()">إغلاق</button>
        </div>
    </div>

    <script>
        let appData = {
            pin: '0000',
            transactions: []
        };

        let financeChart = null;

        function loadData() {
            const savedData = localStorage.getItem('myFinanceData');
            if (savedData) {
                appData = JSON.parse(savedData);
            }
            updateUI();
        }

        function saveData() {
            localStorage.setItem('myFinanceData', JSON.stringify(appData));
            updateUI();
        }

        // فتح التطبيق والانتقال المباشر للرصيد
        function unlockApp() {
            const pinInput = document.getElementById('pin-entry').value;
            if (pinInput === appData.pin) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('pin-entry').value = '';
                document.getElementById('lock-error').style.display = 'none';
                
                // الانتقال التلقائي للرصيد مباشرة عند الدخول
                switchTab('balance-tab', document.getElementById('btn-balance'));
            } else {
                document.getElementById('lock-error').style.display = 'block';
            }
        }

        function lockApp() {
            document.getElementById('lock-screen').style.display = 'flex';
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            
            if(tabId === 'history-tab') renderHistory();
            if(tabId === 'balance-tab') updateChart(getTotalIncome(), getTotalExpense());
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeIcon.className = 'fas fa-sun';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fas fa-moon';
            }
        }

        function addTransaction(type) {
            const now = new Date();
            if (type === 'income') {
                const category = document.getElementById('income-type').value;
                const amount = parseFloat(document.getElementById('income-amount').value);
                const note = document.getElementById('income-note').value;

                if (!amount || amount <= 0) return alert('الرجاء إدخال مبلغ صحيح');

                appData.transactions.push({
                    id: Date.now(),
                    type: 'income',
                    title: category + (note ? ` (${note})` : ''),
                    amount: amount,
                    timestamp: now.toISOString(),
                    dateStr: now.toLocaleDateString('ar-EG')
                });

                document.getElementById('income-amount').value = '';
                document.getElementById('income-note').value = '';

            } else {
                const title = document.getElementById('expense-title').value;
                const amount = parseFloat(document.getElementById('expense-amount').value);

                if (!title || !amount || amount <= 0) return alert('الرجاء تعبئة كافة الحقول بشكل صحيح');

                appData.transactions.push({
                    id: Date.now(),
                    type: 'expense',
                    title: title,
                    amount: amount,
                    timestamp: now.toISOString(),
                    dateStr: now.toLocaleDateString('ar-EG')
                });

                document.getElementById('expense-title').value = '';
                document.getElementById('expense-amount').value = '';
            }

            saveData();
            // الانتقال للرصيد تلقائياً لمشاهدة التحديث مباشرة
            switchTab('balance-tab', document.getElementById('btn-balance'));
        }

        function deleteTransaction(id) {
            if(confirm('هل انت متأكد من حذف هذه العملية؟')) {
                appData.transactions = appData.transactions.filter(t => t.id !== id);
                saveData();
                renderHistory();
            }
        }

        function getTotalIncome() {
            return appData.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
        }

        function getTotalExpense() {
            return appData.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
        }

        function updateUI() {
            const totalIncome = getTotalIncome();
            const totalExpense = getTotalExpense();
            const currentBalance = totalIncome - totalExpense;

            document.getElementById('total-balance').innerText = currentBalance.toFixed(2) + ' د.ل';
            document.getElementById('total-income').innerText = totalIncome.toFixed(2);
            document.getElementById('total-expense').innerText = totalExpense.toFixed(2);

            updateChart(totalIncome, totalExpense);
        }

        // تحديث الرسم البياني
        function updateChart(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            
            if (financeChart) financeChart.destroy();

            financeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['الدخل', 'المصروفات'],
                    datasets: [{
                        data: [income, expense],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#94a3b8',
                                font: { family: 'Tajawal' }
                            }
                        }
                    }
                }
            });
        }

        function renderHistory() {
            const typeFilter = document.getElementById('filter-type').value;
            const dateFilter = document.getElementById('filter-date').value;
            const fullList = document.getElementById('full-history-list');
            fullList.innerHTML = '';

            const now = new Date();

            let filtered = appData.transactions.filter(item => {
                if (typeFilter !== 'all' && item.type !== typeFilter) return false;

                const itemDate = new Date(item.timestamp);
                if (dateFilter === 'today') {
                    return itemDate.toDateString() === now.toDateString();
                } else if (dateFilter === 'week') {
                    const oneWeekAgo = new Date(now);
                    oneWeekAgo.setDate(now.getDate() - 7);
                    return itemDate >= oneWeekAgo;
                } else if (dateFilter === 'month') {
                    return itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
                } else if (dateFilter === 'year') {
                    return itemDate.getFullYear() === now.getFullYear();
                }
                return true;
            });

            let sum = 0;
            filtered.forEach(item => {
                if(item.type === 'income') sum += item.amount;
                else sum -= item.amount;
            });

            document.getElementById('filtered-total').innerText = sum.toFixed(2) + ' د.ل';

            if(filtered.length === 0) {
                fullList.innerHTML = '<p style="text-align:center; color: var(--text-secondary); margin-top:20px;">لا توجد عمليات مطابقة</p>';
                return;
            }

            [...filtered].reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item ${item.type}`;
                div.innerHTML = `
                    <div>
                        <div style="font-weight: bold; font-size: 0.9rem;">${item.title}</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary);">${item.dateStr}</div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span style="font-weight: bold; color: ${item.type === 'income' ? 'var(--accent-green)' : 'var(--accent-red)'}">
                            ${item.type === 'income' ? '+' : '-'}${item.amount.toFixed(2)}
                        </span>
                        <button class="delete-btn" onclick="deleteTransaction(${item.id})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                fullList.appendChild(div);
            });
        }

        // الإعدادات
        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function changePin() {
            const newPin = document.getElementById('new-pin').value;
            if (newPin.length === 4 && !isNaN(newPin)) {
                appData.pin = newPin;
                saveData();
                alert('تم تغيير الرمز بنجاح!');
                document.getElementById('new-pin').value = '';
                closeSettings();
            } else {
                alert('يرجى إدخال رمز مكون من 4 أرقام.');
            }
        }

        function clearData() {
            if (confirm('هل أنت تأكد من مسح جميع البيانات؟ لا يمكن التراجع عن هذا الإجراء.')) {
                appData.transactions = [];
                saveData();
                closeSettings();
            }
        }

        loadData();
    </script>
</body>
</html>
